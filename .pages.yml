# Pages CMS configuration — https://pagescms.org/docs/configuration/
media:
  input: docs/public/images
  output: /images
  extensions: [jpg, jpeg, png, webp]
  categories: [image]

content:
  - name: home
    label: Home page
    type: file
    path: docs/index.md
    format: yaml-frontmatter
    fields:
      - { name: title, label: Browser/search title, type: string, description: "Shown in Google results and the browser tab. ' | Times Produce' is added automatically." }
      - { name: description, label: Search description, type: text, description: "One or two sentences shown under the title in Google (about 150 characters)." }
      - name: hero
        label: Top section
        type: object
        fields:
          - { name: heading, label: Heading, type: string }
          - { name: text, label: Text, type: text }
          - { name: image, label: Photo, type: image }
          - { name: image_alt, label: Photo description (for screen readers), type: string }
          - { name: eyebrow, label: Small line above the heading (say what you do and where), type: string }
      - { name: aspects_heading, label: Teal section heading, type: string }
      - name: aspects
        label: Three highlights
        type: object
        list: true
        fields:
          - name: icon
            label: Icon
            type: select
            options:
              values:
                - { value: box, label: Box }
                - { value: globe, label: Globe }
                - { value: check, label: Checklist }
          - { name: title, label: Title, type: string }
          - { name: text, label: Text, type: text }
      - { name: button_label, label: Button text, type: string }
      - name: audiences
        label: Buyer and grower boxes (bottom of page)
        type: object
        fields:
          - name: buyers
            label: For wholesale buyers
            type: object
            fields: [ { name: heading, label: Heading, type: string }, { name: text, label: Text, type: text }, { name: button_label, label: Button text, type: string } ]
          - name: growers
            label: For farmers and growers
            type: object
            fields: [ { name: heading, label: Heading, type: string }, { name: text, label: Text, type: text, description: "Plain words, short sentences." }, { name: button_label, label: Button text, type: string } ]
      - { name: bottom_image, label: Bottom photo, type: image }
      - { name: bottom_image_alt, label: Bottom photo description, type: string }

  - name: services
    label: Services page
    type: file
    path: docs/services.md
    format: yaml-frontmatter
    fields:
      - { name: title, label: Browser/search title, type: string }
      - { name: description, label: Search description, type: text }
      - { name: image, label: Photo, type: image }
      - { name: image_alt, label: Photo description, type: string }
      - { name: heading, label: Heading, type: string }
      - { name: intro, label: Intro text, type: text, description: "Leave a blank line between paragraphs." }
      - name: distributor
        label: Looking-for-a-distributor box
        type: object
        fields:
          - { name: heading, label: Heading (what a buyer would search for), type: string }
          - { name: text, label: Intro, type: text, description: "About 8th-grade reading level. Only say things that are true and that you can deliver." }
          - { name: points, label: Points, type: string, list: true }
          - { name: button_label, label: Button text, type: string }
      - name: sections
        label: Sections
        type: object
        list: true
        fields:
          - { name: heading, label: Heading, type: string }
          - { name: text, label: Text, type: text }
      - { name: button_label, label: Button text, type: string }
      - name: grower_note
        label: Note for farmers (optional)
        type: object
        fields: [ { name: heading, label: Heading, type: string }, { name: text, label: Text, type: text }, { name: button_label, label: Button text, type: string } ]

  - name: produce
    label: Produce page
    type: file
    path: docs/produce.md
    format: yaml-frontmatter
    fields:
      - { name: title, label: Browser/search title, type: string }
      - { name: description, label: Search description, type: text }
      - { name: image, label: Photo, type: image }
      - { name: image_alt, label: Photo description, type: string }
      - { name: heading, label: Heading, type: string }
      - { name: intro, label: Intro text, type: text }
      - { name: ask_more, label: "Line after the intro (for example: Don't see it? Ask us.)", type: string }
      - { name: button_label, label: Button text, type: string }
      - name: vegetables
        label: Vegetables
        type: object
        fields:
          - { name: heading, label: Heading, type: string }
          - { name: intro, label: Intro (optional), type: text }
          - name: groups
            label: Groups (for example Citrus, Mushrooms)
            type: object
            list: true
            fields:
              - { name: heading, label: Group name, type: string }
              - { name: items, label: Items, type: string, list: true }
      - name: fruits
        label: Fruits
        type: object
        fields:
          - { name: heading, label: Heading, type: string }
          - { name: intro, label: Intro (optional), type: text }
          - name: groups
            label: Groups (for example Citrus, Mushrooms)
            type: object
            list: true
            fields:
              - { name: heading, label: Group name, type: string }
              - { name: items, label: Items, type: string, list: true }

  - name: contact
    label: Contact page
    type: file
    path: docs/contact.md
    format: yaml-frontmatter
    fields:
      - { name: title, label: Browser/search title, type: string }
      - { name: description, label: Search description, type: text }
      - { name: image, label: Photo, type: image }
      - { name: image_alt, label: Photo description, type: string }
      - { name: heading, label: Heading, type: string }
      - { name: intro, label: Intro text, type: text }
      - { name: submit_label, label: Send button text, type: string }
      - { name: success_message, label: Message after sending, type: string }
      - { name: error_message, label: Message if sending fails, type: string }

  - name: grow
    label: Grow With Us page (for farmers)
    type: file
    path: docs/grow.md
    format: yaml-frontmatter
    fields:
      - { name: title, label: Browser/search title, type: string, description: "Say what a farmer would search for, e.g. 'Sell Your Produce to ...'." }
      - { name: description, label: Search description, type: text }
      - { name: image, label: Photo, type: image }
      - { name: image_alt, label: Photo description, type: string }
      - { name: heading, label: Heading, type: string }
      - { name: intro, label: Intro text, type: text, description: "Plain words, short sentences (about 6th-grade reading level). Leave a blank line between paragraphs." }
      - name: what_we_buy
        label: What we buy
        type: object
        fields:
          - { name: heading, label: Heading, type: string }
          - { name: text, label: Text, type: text, description: "Plain words, short sentences (about 6th-grade reading level)." }
          - { name: items, label: Crops we buy, type: string, list: true }
      - { name: form_button_label, label: Button that jumps to the form, type: string }
      - { name: faq_heading, label: Questions heading, type: string }
      - name: faq
        label: Common questions
        type: object
        list: true
        fields:
          - { name: question, label: Question, type: string }
          - { name: answer, label: Answer, type: text, description: "Plain words, short sentences. Do not name specific certifications." }
      - name: food_safety
        label: Food safety
        type: object
        fields:
          - { name: heading, label: Heading, type: string }
          - { name: text, label: Text, type: text, description: "Say growers must follow all required food safety guidelines. Do not name specific certifications. Plain words, short sentences." }
          - { name: help, label: Help line, type: string }
      - name: form
        label: Form section
        type: object
        fields:
          - { name: heading, label: Heading, type: string }
          - { name: intro, label: Text, type: text }
      - { name: submit_label, label: Send button text, type: string }
      - { name: success_message, label: Message after sending, type: string }
      - { name: error_message, label: Message if sending fails, type: string }
      - { name: buyer_link_label, label: Link to the buyer contact page, type: string }

  - name: site
    label: Address, phone & footer
    type: file
    path: docs/.vitepress/site.json
    format: json
    fields:
      - { name: name, label: Business name, type: string }
      - { name: phone_display, label: Phone (as shown), type: string }
      - { name: phone_link, label: Phone (for tap-to-call, digits with +1), type: string }
      - { name: fax_display, label: Fax, type: string }
      - name: address
        label: Address
        type: object
        fields:
          - { name: street, label: Street, type: string }
          - { name: city, label: City, type: string }
          - { name: state, label: State, type: string }
          - { name: zip, label: ZIP, type: string }
      - { name: credit_text, label: Footer credit text, type: string }
      - { name: credit_name, label: Credit name, type: string }
      - { name: credit_url, label: Credit link, type: string }

  - name: ui_en
    label: "Menu, form labels & footer words"
    type: file
    path: docs/.vitepress/i18n/en.json
    format: json
    fields:
      - name: nav
        label: Nav
        type: object
        fields:
          - { name: home, label: Home, type: string }
          - { name: services, label: Services, type: string }
