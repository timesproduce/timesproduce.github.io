          - { name: logo_alt, label: Logo alt, type: string }
          - { name: menu, label: Menu, type: string }
          - { name: close_menu, label: Close menu, type: string }
          - { name: site_navigation, label: Site navigation, type: string }
          - { name: language, label: Language, type: string }
          - { name: footer_photo_alt, label: Footer photo alt, type: string }
          - { name: phone_label, label: Phone label, type: string }
          - { name: fax_label, label: Fax label, type: string }
          - { name: map_title, label: Map title, type: string }
          - { name: footer_grow, label: Footer grow, type: string }
          - { name: footer_contact, label: Footer contact, type: string }
      - name: not_found
        label: Not Found
        type: object
        fields:
          - { name: title, label: Title, type: string }
          - { name: back, label: Back, type: string }
      - name: contact_form
        label: Contact Form
        type: object
        fields:
          - { name: first_name, label: First name, type: string }
          - { name: last_name, label: Last name, type: string }
          - { name: email, label: Email, type: string }
          - { name: phone, label: Phone, type: string }
          - { name: company, label: Company, type: string }
          - { name: message, label: Message, type: string }
          - { name: message_placeholder, label: Message placeholder, type: string }
          - { name: sending, label: Sending, type: string }
      - name: grower_form
        label: Grower Form
        type: object
